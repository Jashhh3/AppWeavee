services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appweave}
      POSTGRES_USER: ${POSTGRES_USER:-appweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appweave-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DATA_FILE: /data/appweave.json
      DATABASE_URL: ${DATABASE_URL:-postgresql://appweave:appweave-local-only@postgres:5432/appweave}
      PROJECT_WORKSPACE_ROOT: ${PROJECT_WORKSPACE_ROOT:-/data/projects}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-180000}
      # Keep false in production; local test startup sets NODE_ENV=development and enables this explicitly.
      APPWEAVE_MCP_LOCAL_TEST_MODE: ${APPWEAVE_MCP_LOCAL_TEST_MODE:-false}
      APPWEAVE_DOCKER_WORKER: ${APPWEAVE_DOCKER_WORKER:-false}
      # Match Compose's existing project-prefixed volume; do not rename the volume below.
      APPWEAVE_DOCKER_WORKER_VOLUME: ${APPWEAVE_DOCKER_WORKER_VOLUME:-${COMPOSE_PROJECT_NAME:-appweave}_appweave-projects}
      APPWEAVE_DOCKER_WORKER_IMAGE: ${APPWEAVE_DOCKER_WORKER_IMAGE:-node:20.15.1-bookworm-slim}
    volumes:
      - appweave-data:/data
      - appweave-projects:/data/projects
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
  dashboard:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
volumes:
  appweave-data:
  appweave-projects:
  postgres-data:
